<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f2" />
    <meta name="description" content="2026 FIFA 世界盃比分預測與派彩紀錄。" />
    <title>2026 FIFA｜START FROM 0702</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">WORLD CUP · BET LOG</p>
          <h1>2026 FIFA</h1>
          <p class="hero-subtitle">START FROM 0702</p>
          <p class="hero-description">世界盃比分預測、賠率與派彩紀錄。</p>
        </div>

        <div class="account">
          <span id="authStatus" class="auth-status" aria-live="polite">未登入</span>
          <div class="auth-actions">
            <button id="googleLoginBtn" class="button button-dark" type="button">使用 Google 登入</button>
            <button id="logoutBtn" class="button button-light" type="button" hidden>登出</button>
          </div>
        </div>
      </header>

      <section class="toolbar" aria-label="資料操作">
        <p id="syncHint">未登入時，資料只會儲存在這台裝置。</p>
        <div>
          <button id="refreshMatchesBtn" class="text-button" type="button">更新賽程/賽果</button>
          <button id="exportBtn" class="text-button" type="button">匯出 JSON</button>
          <button id="resetDataBtn" class="text-button danger-text" type="button">清空資料</button>
        </div>
      </section>

      <section class="dashboard">
        <article class="card form-card">
          <div class="section-title">
            <span>01</span>
            <h2>新增紀錄</h2>
          </div>

          <form id="betForm">
            <div class="form-grid">
              <label>
                <span>成員</span>
                <input id="memberInput" name="member" type="text" placeholder="請先使用 Google 登入" readonly required />
              </label>
              <label>
                <span>賽事日期</span>
                <input id="dateInput" name="date" type="date" readonly required />
              </label>
              <label class="wide-field">
                <span>賽事 / 隊伍</span>
                <select id="matchInput" name="match" required>
                  <option value="">載入近 3 天賽事中...</option>
                </select>
                <input id="matchIdInput" name="matchId" type="hidden" />
                <input id="manualMatchInput" type="text" placeholder="手動輸入賽事，例如：德國 vs 日本" hidden />
              </label>
              <label>
                <span>下注金額</span>
                <input id="amountInput" name="amount" type="number" min="0" step="1" placeholder="0" required />
              </label>
              <label>
                <span>賠率</span>
                <input id="oddsInput" name="odds" type="number" min="0" step="0.01" placeholder="1.00" required />
              </label>
              <fieldset id="scoreFields" class="wide-field score-fieldset" disabled>
                <legend>預測比數</legend>
                <p id="scoreHint">請先選擇賽事，系統會帶入兩隊名稱。</p>
                <div class="score-inputs">
                  <label><span id="homeScoreLabel">A 隊</span><input id="homeScoreInput" name="homeScore" type="number" min="0" max="99" step="1" inputmode="numeric" placeholder="0" required /></label>
                  <span class="score-divider" aria-hidden="true">—</span>
                  <label><span id="awayScoreLabel">B 隊</span><input id="awayScoreInput" name="awayScore" type="number" min="0" max="99" step="1" inputmode="numeric" placeholder="0" required /></label>
                </div>
              </fieldset>
            </div>
            <button class="button button-dark submit-button" type="submit" disabled title="請先使用 Google 登入">加入紀錄 <span aria-hidden="true">→</span></button>
          </form>
        </article>

        <aside class="card stats-card">
          <div class="section-title">
            <span>02</span>
            <h2>總覽</h2>
          </div>
          <div id="summaryStats" class="summary-grid"></div>
        </aside>
      </section>

      <section class="card records-card">
        <div class="section-header">
          <div class="section-title">
            <span>03</span>
            <h2>紀錄明細</h2>
          </div>
          <div class="filters">
            <input id="searchInput" type="search" placeholder="搜尋成員或賽事" aria-label="搜尋紀錄" />
            <select id="filterMember" aria-label="依成員篩選">
              <option value="all">所有成員</option>
            </select>
            <select id="filterResult" aria-label="依結果篩選">
              <option value="all">所有結果</option>
              <option value="pending">未開獎</option>
              <option value="win">贏</option>
              <option value="loss">輸</option>
            </select>
          </div>
        </div>

        <details class="records-details">
          <summary id="recordsToggleSummary">展開紀錄</summary>
          <div class="table-wrap">
            <table>
            <thead>
              <tr>
                <th>成員</th>
                <th>日期</th>
                <th>賽事 / 隊伍</th>
                <th>金額</th>
                <th>賠率</th>
                <th>結果</th>
                <th>預測比數</th>
                <th><span class="sr-only">操作</span></th>
              </tr>
            </thead>
            <tbody id="recordsBody"></tbody>
            </table>
          </div>
        </details>
      </section>

      <section class="card analysis-card">
        <div class="section-title">
          <span>04</span>
          <h2>各場預測比分分布</h2>
        </div>
        <div class="analysis-filters" aria-label="統計篩選">
          <label><span>日期</span><select id="analysisDateFilter"><option value="all">所有日期</option></select></label>
          <label><span>場次</span><select id="analysisMatchFilter"><option value="all">所有場次</option></select></label>
        </div>
        <p class="section-description">每一場賽事獨立統計，查看成員對該場比分的預測占比。</p>
        <div class="match-breakdown" id="matchBreakdown"></div>
      </section>

      <section class="card analysis-card">
        <div class="section-title">
          <span>05</span>
          <h2>分類統計</h2>
        </div>
        <p class="section-description">沿用上方的日期與場次篩選。</p>
        <div id="filteredSummary" class="summary-grid filtered-summary"></div>
        <div class="mini-grid">
          <div class="panel">
            <h3>依成員</h3>
            <div id="memberStats"></div>
          </div>
          <div class="panel">
            <h3>依日期</h3>
            <div id="dateStats"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
