<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>2026 FIFA 運彩記錄中心</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div class="auth-panel">
          <div id="authStatus" class="auth-status">尚未登入</div>
          <div id="authActions" class="auth-actions">
            <button id="loginBtn" class="primary-btn" type="button">登入</button>
            <button id="registerBtn" class="ghost-btn" type="button">註冊</button>
            <button id="logoutBtn" class="ghost-btn" type="button">登出</button>
          </div>
        </div>
        <div>
          <p class="eyebrow">共用帳號 · 小組管理</p>
          <h1>2026 FIFA 運彩記錄中心</h1>
          <p class="hero-copy">
            快速記錄每個人、每一天的下注內容，讓你們一起算錢、追結果。
          </p>
        </div>
        <div class="hero-actions">
          <button id="resetDataBtn" class="ghost-btn" type="button">清空資料</button>
          <button id="exportBtn" class="primary-btn" type="button">匯出 JSON</button>
        </div>
      </header>

      <section class="floating-dock" aria-label="快速操作">
        <div class="dock-item">
          <span>總額</span>
          <strong id="dockAmount">0</strong>
        </div>
        <div class="dock-item">
          <span>未結算</span>
          <strong id="dockPending">0</strong>
        </div>
        <a href="#betForm" class="primary-btn dock-action">快速新增</a>
      </section>

      <section class="controls">
        <div class="card form-card">
          <h2>新增投注</h2>
          <form id="betForm">
            <div class="grid">
              <label>
                <span>下注人</span>
                <input id="memberInput" name="member" type="text" placeholder="例如：阿哲" required />
              </label>
              <label>
                <span>日期</span>
                <input id="dateInput" name="date" type="date" required />
              </label>
              <label>
                <span>賽事 / 玩法</span>
                <input id="matchInput" name="match" type="text" placeholder="例如：巴西 vs 阿根廷" required />
              </label>
              <label>
                <span>下注金額</span>
                <input id="amountInput" name="amount" type="number" min="0" step="1" required />
              </label>
              <label>
                <span>賠率</span>
                <input id="oddsInput" name="odds" type="number" min="0" step="0.01" required />
              </label>
              <label>
                <span>結果</span>
                <select id="resultInput" name="result">
                  <option value="pending">未結算</option>
                  <option value="win">贏</option>
                  <option value="loss">輸</option>
                </select>
              </label>
            </div>
            <label class="full-width">
              <span>備註</span>
              <textarea id="noteInput" name="note" rows="3" placeholder="可填下注內容、賠率說明或分帳備註"></textarea>
            </label>
            <button class="primary-btn submit-btn" type="submit">新增記錄</button>
          </form>
        </div>

        <div class="card stats-card">
          <h2>統計摘要</h2>
          <div id="summaryStats" class="summary-grid"></div>
        </div>
      </section>

      <section class="card">
        <div class="section-header">
          <h2>投注紀錄</h2>
          <div class="filters">
            <input id="searchInput" type="search" placeholder="搜尋下注人 / 賽事" />
            <select id="filterMember">
              <option value="all">所有人</option>
            </select>
            <select id="filterResult">
              <option value="all">所有狀態</option>
              <option value="pending">未結算</option>
              <option value="win">贏</option>
              <option value="loss">輸</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>下注人</th>
                <th>日期</th>
                <th>賽事 / 玩法</th>
                <th>金額</th>
                <th>賠率</th>
                <th>結果</th>
                <th>備註</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="recordsBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>分組統計</h2>
        <div class="mini-grid">
          <div class="panel">
            <h3>按人分組</h3>
            <div id="memberStats"></div>
          </div>
          <div class="panel">
            <h3>按日期分組</h3>
            <div id="dateStats"></div>
          </div>
        </div>
      </section>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
