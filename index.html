<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f2" />
    <meta name="description" content="簡潔的 2026 世界盃下注紀錄與統計工具" />
    <title>2026 FIFA｜下注紀錄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">WORLD CUP 2026 · BET LOG</p>
          <h1>下注紀錄</h1>
          <p>把每一筆下注、賠率與結果放在同一個乾淨的地方。</p>
        </div>

        <div class="account">
          <span id="authStatus" class="auth-status" aria-live="polite">未登入</span>
          <div class="auth-actions">
            <button id="googleLoginBtn" class="button button-dark" type="button">使用 Google 登入</button>
            <button id="logoutBtn" class="button button-light" type="button" hidden>登出</button>
          </div>
        </div>
      </header>

      <section class="toolbar" aria-label="資料操作">
        <p id="syncHint">未登入時，資料只會儲存在這台裝置。</p>
        <div>
          <button id="refreshMatchesBtn" class="text-button" type="button">更新賽程/賽果</button>
          <button id="exportBtn" class="text-button" type="button">匯出 JSON</button>
          <button id="resetDataBtn" class="text-button danger-text" type="button">清空資料</button>
        </div>
      </section>

      <section class="dashboard">
        <article class="card form-card">
          <div class="section-title">
            <span>01</span>
            <h2>新增紀錄</h2>
          </div>

          <form id="betForm">
            <div class="form-grid">
              <label>
                <span>成員</span>
                <input id="memberInput" name="member" type="text" placeholder="例如：小明" autocomplete="name" required />
              </label>
              <label>
                <span>日期</span>
                <input id="dateInput" name="date" type="date" required />
              </label>
              <label class="wide-field">
                <span>賽事 / 隊伍</span>
                <select id="matchInput" name="match" required>
                  <option value="">載入近 3 天賽事中...</option>
                </select>
                <input id="matchIdInput" name="matchId" type="hidden" />
                <input id="manualMatchInput" type="text" placeholder="手動輸入賽事，例如：德國 vs 日本" hidden />
              </label>
              <label>
                <span>下注金額</span>
                <input id="amountInput" name="amount" type="number" min="0" step="1" placeholder="0" required />
              </label>
              <label>
                <span>賠率</span>
                <input id="oddsInput" name="odds" type="number" min="0" step="0.01" placeholder="1.00" required />
              </label>
              <label>
                <span>結果</span>
                <select id="resultInput" name="result">
                  <option value="pending">未開獎</option>
                  <option value="win">贏</option>
                  <option value="loss">輸</option>
                </select>
              </label>
              <label class="wide-field">
                <span>預測比數</span>
                <input id="noteInput" name="note" type="text" placeholder="例如：2-1" />
              </label>
            </div>
            <button class="button button-dark submit-button" type="submit">加入紀錄 <span aria-hidden="true">→</span></button>
          </form>
        </article>

        <aside class="card stats-card">
          <div class="section-title">
            <span>02</span>
            <h2>總覽</h2>
          </div>
          <div id="summaryStats" class="summary-grid"></div>
        </aside>
      </section>

      <section class="card records-card">
        <div class="section-header">
          <div class="section-title">
            <span>03</span>
            <h2>紀錄明細</h2>
          </div>
          <div class="filters">
            <input id="searchInput" type="search" placeholder="搜尋成員或賽事" aria-label="搜尋紀錄" />
            <select id="filterMember" aria-label="依成員篩選">
              <option value="all">所有成員</option>
            </select>
            <select id="filterResult" aria-label="依結果篩選">
              <option value="all">所有結果</option>
              <option value="pending">未開獎</option>
              <option value="win">贏</option>
              <option value="loss">輸</option>
            </select>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>成員</th>
                <th>日期</th>
                <th>賽事 / 隊伍</th>
                <th>金額</th>
                <th>賠率</th>
                <th>結果</th>
                <th>預測比數</th>
                <th><span class="sr-only">操作</span></th>
              </tr>
            </thead>
            <tbody id="recordsBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card analysis-card">
        <div class="section-title">
          <span>04</span>
          <h2>直覺統計</h2>
        </div>
        <div class="visual-grid">
          <div class="panel">
            <h3>大家下哪些場次</h3>
            <div id="matchChart"></div>
          </div>
          <div class="panel">
            <h3>大家猜哪些比數</h3>
            <div id="scoreChart"></div>
          </div>
        </div>
        <div class="match-breakdown" id="matchBreakdown"></div>
      </section>

      <section class="card analysis-card">
        <div class="section-title">
          <span>05</span>
          <h2>分類統計</h2>
        </div>
        <div class="mini-grid">
          <div class="panel">
            <h3>依成員</h3>
            <div id="memberStats"></div>
          </div>
          <div class="panel">
            <h3>依日期</h3>
            <div id="dateStats"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
